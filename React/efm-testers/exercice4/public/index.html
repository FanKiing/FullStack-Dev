<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscription Stagiaire</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
      }
      .box {
        width: 360px;
        margin: 50px auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      .row {
        display: flex;
        align-items: center;
        margin-bottom: 12px;
      }
      .row label {
        width: 90px;
      }
      .row input {
        flex: 1;
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        width: 100%;
        padding: 9px;
        background: #2d7ef7;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { opacity: 0.9; }
    </style>
  </head>

  <body>
    <div class="box">
      <h3 style="text-align:center;">Inscription Stagiaire</h3>

      <form id="formInscription">
        <div class="row">
          <label>CIN :</label>
          <input type="text" id="cin" />
        </div>

        <div class="row">
          <label>Nom :</label>
          <input type="text" id="nom" />
        </div>

        <div class="row">
          <label>Prénom :</label>
          <input type="text" id="prenom" />
        </div>

        <div class="row">
          <label>Date :</label>
          <input type="date" id="dateNaissance" />
        </div>

        <button type="submit">ENVOYER</button>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
